# bkom.psedlak.cz - 3x3 grid of BKOM Brno traffic cameras
#
# The upstream CDN (stream.tikiti.cz) returns 403 unless the request carries
# Referer: https://www.bkom.cz/ -- a browser cannot forge that header, so the
# HLS playlists and segments are reverse-proxied here with the Referer injected.
<VirtualHost *:80>
	ServerName bkom.psedlak.cz
	DocumentRoot /var/www/html

	ErrorLog ${APACHE_LOG_DIR}/bkom-error.log
	CustomLog ${APACHE_LOG_DIR}/bkom-access.log combined

	# Two camera walls; the root goes to the traffic one.
	RedirectMatch ^/$ /doprava/

	SSLProxyEngine On
	ProxyRequests Off
	ProxyPreserveHost Off

	# Single rule: /hls/<streamId>/s.m3u8 and its relative .ts segments.
	<Location /hls/>
		ProxyPass https://stream.tikiti.cz/m2TXiSQJU6Uj7Si3gnBmp8ahPxWwTj/hls/tLHry2BbKz/
		RequestHeader set Referer "https://www.bkom.cz/"
		RequestHeader unset Origin
		# Live playlists must never be cached.
		Header always set Cache-Control "no-store"
	</Location>
	ProxyPassReverse /hls/ https://stream.tikiti.cz/m2TXiSQJU6Uj7Si3gnBmp8ahPxWwTj/hls/tLHry2BbKz/
</VirtualHost>
